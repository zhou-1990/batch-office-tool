name   名字: Build and Release EXE

on:   :
  push:   推动:
    branches: [ main ]   分支：[主]
  workflow_dispatch:

jobs:   工作:
  build:   构建:
    runs-on: windows-latest   上运行:windows-latest
    
    steps:   步骤:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 6.0   —name：设置项。NET 6.0
      uses: actions/setup-dotnet@v4
      with:   :
        dotnet-version: '6.0.x'   . x的   . x”   . x的   dotnet-version: ' . x '   ”。x '   ”。x '
    
    - name: Restore dependencies—name：恢复依赖项
      run: dotnet restore   执行命令dotnet restore
    
    - name: Build Release   —name: Build Release
      run: dotnet build -c Release --no-restore运行：dotnet build -c Release——no-restore
    
    - name: Publish EXE   —name：发布EXE
      run: dotnet publish -c Release -o ./publish -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true --runtime win-x64执行命令dotnet publish -c Release - 0。/publish -p:PublishSingleFile=true -p:SelfContained=true -p: inclenativelibrariesforselfextract =true——runtime win-x64
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:   :
        name: BatchOfficeTool-EXE   名称:BatchOfficeTool-EXE
        path: ./publish/BatchOfficeTool.exe路径:/发布/ BatchOfficeTool.exe
        retention-days: 90
