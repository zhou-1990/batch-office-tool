name: Build and Release EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Release
      run: dotnet build -c Release --no-restore
    
    - name: Publish EXE
      run: dotnet publish -c Release -o ./publish -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true --runtime win-x64
    
    - name: Upload to Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: BatchOfficeTool-EXE
        path: ./publish/BatchOfficeTool.exe
        retention-days: 90
